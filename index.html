<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0F14">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Passa</title>
<style>
/* Layout: jedna kolumna jak natywna apka, nagłówek tygodnia, karty zadań, dolny pasek Zadania/Progres */
:root{
  --bg:#0E0F14; --surface:#171922; --surface2:#21242F; --line:#2C3040;
  --fg:#F3F1EA; --muted:#8D91A4;
  --flame:#FF7A1A; --flame2:#FFB23E; --gold:#F5C542; --ok:#3DDC97; --bad:#FF5C70; --chart:#86A2FF;
  --r:20px;
  --font:"Google Sans Flex","Google Sans",system-ui,Roboto,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:15px/1.4 var(--font);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--fg)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--flame2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}

/* nagłówek */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wk{display:flex;flex-direction:column}
.wk b{font-size:26px;letter-spacing:-.02em;line-height:1.1}
.wk span{color:var(--muted);font-size:13px}
.lvl{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:6px 6px 6px 14px}
.lvl .lv{font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.xpbar{width:56px;height:6px;border-radius:9px;background:var(--surface2);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--flame),var(--gold));border-radius:9px}
.gear{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface2)}
.gear svg{width:18px;height:18px;fill:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day i{display:block;width:100%;height:6px;border-radius:9px;background:var(--surface2)}
.day.past i{background:#3A3F52}
.day.today{color:var(--fg);font-weight:700}
.day.today i{background:var(--flame)}
.sum{display:flex;gap:10px;margin-top:16px}
.stat{flex:1;min-width:0;background:var(--surface);border-radius:16px;padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-size:22px}
.stat b em{font-style:normal;font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}

/* karty zadań */
h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:26px 2px 10px;font-weight:600}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px 14px;align-items:center;border:1.5px solid transparent;transition:border-color .3s,box-shadow .3s}
.card.met{border-color:rgba(255,122,26,.35)}
.card.gold{border-color:var(--gold);box-shadow:0 0 0 4px rgba(245,197,66,.08),0 8px 30px -10px rgba(245,197,66,.35)}
.card.risk{border-color:rgba(255,92,112,.45)}
.card .main{min-width:0;display:flex;flex-direction:column;gap:8px;text-align:left}
.tname{font-size:18px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px}
.tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.tag.p{color:var(--chart)}
.pips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pip{width:22px;height:10px;border-radius:5px;background:var(--surface2);position:relative}
.pip.on{background:var(--flame)}
.card.gold .pip.on{background:var(--gold)}
.pip.minline::after{content:"";position:absolute;right:-4px;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--muted)}
.pip.bonus{width:10px}
.status{font-size:13px;color:var(--muted)}
.status b{color:var(--fg);font-weight:600}
.card.risk .status b{color:var(--bad)}
.card.gold .status b{color:var(--gold)}
.side{display:flex;flex-direction:column;align-items:center;gap:8px}
.streak{display:flex;align-items:center;gap:3px;font-weight:800;font-size:17px;color:var(--muted)}
.streak svg{width:18px;height:18px;fill:currentColor}
.streak small{font-weight:500;font-size:11px;color:var(--muted)}
.streak.on{color:var(--flame)}
.streak.gold{color:var(--gold)}
.go{width:62px;height:62px;border-radius:20px;background:linear-gradient(160deg,var(--flame2),var(--flame));color:#1B0D00;display:grid;place-items:center;box-shadow:0 6px 18px -6px rgba(255,122,26,.6);transition:transform .12s}
.go svg{width:30px;height:30px;stroke:#1B0D00;stroke-width:3;fill:none;stroke-linecap:round}
.go:active{transform:scale(.9)}
.card.gold .go{background:linear-gradient(160deg,#FFE08A,var(--gold));box-shadow:0 6px 18px -6px rgba(245,197,66,.6)}
.go.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}

.empty{background:var(--surface);border-radius:var(--r);padding:22px;color:var(--muted);line-height:1.5}
.empty b{color:var(--fg);display:block;font-size:17px;margin-bottom:4px}
.example{margin-top:14px;display:flex;flex-direction:column;gap:8px}

/* progres */
.ptask{margin-top:22px}
.ptask h3{margin:0 2px 10px;font-size:20px;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center;gap:10px}
.small-btn{font-size:13px;font-weight:600;padding:8px 12px;border-radius:12px;background:var(--surface2);color:var(--fg);white-space:nowrap}
.tcard{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px}
.thead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.thead .nm{font-weight:700;font-size:16px;min-width:0;overflow-wrap:anywhere}
.thead .nm small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:2px}
.big{text-align:right;white-space:nowrap}
.big b{font-size:28px;letter-spacing:-.02em}
.big span{color:var(--muted);font-size:13px;margin-left:3px}
.delta{font-size:12px;font-weight:700}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)} .delta.flat{color:var(--muted)}
.chart{width:100%;height:170px;display:block;margin-top:10px}
.pr{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--gold);background:rgba(245,197,66,.1);padding:3px 8px;border-radius:6px;margin-top:8px}
.hist{margin-top:10px;border-top:1px solid var(--line)}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px;gap:10px}
.hrow:last-child{border-bottom:0}
.hrow span{color:var(--muted)}
.hrow .x{color:var(--muted);font-size:12px;padding:4px 8px;border-radius:8px;background:var(--surface2)}
.hrow .x.sure{background:var(--bad);color:#fff}
.more{font-size:13px;color:var(--muted);padding:8px 2px 0;text-decoration:underline}

/* dolny pasek */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(14,15,20,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;height:72px}
.tab{flex:1;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;color:var(--muted)}
.tab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{background:var(--surface2);color:var(--fg)}
.fab{width:56px;height:56px;border-radius:18px;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none}
.fab svg{width:26px;height:26px;stroke:var(--bg);stroke-width:2.6;fill:none;stroke-linecap:round}

/* arkusze */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet h4{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
.sheet .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label,.lab{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.inp{width:100%;background:var(--surface2);border:1.5px solid transparent;border-radius:14px;padding:13px 14px;outline:none}
.inp:focus{border-color:var(--flame)}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.type{text-align:left;background:var(--surface2);border:1.5px solid transparent;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.type b{font-size:15px}
.type span{font-size:12px;color:var(--muted);line-height:1.35}
.type .code{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.type.on{border-color:var(--flame);background:rgba(255,122,26,.08)}
.type.on .code{color:var(--flame)}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.stepper{background:var(--surface2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.stepper .row{display:flex;align-items:center;justify-content:space-between}
.stepper button{width:38px;height:38px;border-radius:12px;background:var(--surface);font-size:22px;line-height:1}
.stepper b{font-size:26px}
.stepper b small{font-size:12px;color:var(--muted);font-weight:500}
.hint{font-size:12.5px;color:var(--muted);line-height:1.45;margin:0 0 18px}
.hint b{color:var(--flame2)} .hint i{color:var(--gold);font-style:normal;font-weight:700}
.testrow{display:grid;grid-template-columns:1fr 74px auto;gap:8px;margin-bottom:8px;align-items:center}
.testrow .inp{padding:11px 12px}
.dir{background:var(--surface2);border-radius:12px;padding:10px;font-size:12px;font-weight:700;white-space:nowrap;min-width:78px}
.rm{width:30px;height:30px;border-radius:9px;background:var(--surface2);color:var(--muted)}
.testrow.has-rm{grid-template-columns:1fr 64px auto 30px}
.addt{font-size:14px;font-weight:600;color:var(--flame2);padding:8px 0}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.btn{height:54px;border-radius:16px;font-weight:700;font-size:16px;background:var(--surface2)}
.btn.pri{background:linear-gradient(160deg,var(--flame2),var(--flame));color:#1B0D00}
.btn.ghost{background:none;color:var(--muted);height:44px}
.btn.danger{background:none;color:var(--bad);height:44px}
.btn.danger.sure{background:var(--bad);color:#fff}
.err{color:var(--bad);font-size:13px;margin:-8px 0 12px}
.logt{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;margin-bottom:12px}
.logt .nm b{display:block;font-size:15px}
.logt .nm small{color:var(--muted);font-size:12px}
.logt .inp{text-align:right;font-size:18px;font-weight:700}
.newtest{background:var(--surface2);border-radius:16px;padding:12px;margin-top:4px}
.newtest .testrow .inp{background:var(--surface)}
.newtest .dir{background:var(--surface)}

/* szczegóły */
.dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 18px}
.dstats div{background:var(--surface2);border-radius:14px;padding:10px 12px}
.dstats small{display:block;color:var(--muted);font-size:11px}
.dstats b{font-size:20px}
.grid12{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin:8px 0 6px}
.grid12 i{aspect-ratio:1;max-width:100%;border-radius:6px;background:var(--surface2)}
.grid12 i.miss{background:#3A2530}
.grid12 i.met{background:var(--flame)}
.grid12 i.gold{background:var(--gold)}
.grid12 i.cur{outline:2px solid var(--fg);outline-offset:1px}
.grid12 i.cur:not(.met):not(.gold){background:var(--surface2)}
.grid12 i.none{background:transparent;border:1px dashed var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:16px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* toast + efekty */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);border-radius:14px;padding:12px 14px 12px 16px;display:flex;gap:14px;align-items:center;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.4);animation:up .25s}
.toast button{color:var(--flame);font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.05em}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
.burst{position:fixed;inset:0;z-index:65;display:grid;place-items:center;pointer-events:none}
.burst div{text-align:center;animation:burst 1.9s cubic-bezier(.2,.9,.3,1) forwards;background:rgba(14,15,20,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:22px 24px;border-radius:26px;max-width:calc(100% - 32px)}
.burst b{display:block;font-size:clamp(30px,10vw,44px);font-weight:900;letter-spacing:-.03em;line-height:1;text-transform:uppercase;color:var(--flame2);text-shadow:0 6px 30px rgba(255,122,26,.5)}
.burst.gold b{color:var(--gold);text-shadow:0 6px 30px rgba(245,197,66,.55)}
.burst span{display:block;margin-top:10px;font-size:16px;font-weight:600;color:var(--fg)}
@keyframes burst{0%{transform:scale(.4);opacity:0}18%{transform:scale(1.08);opacity:1}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.04)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="nav"><div class="in">
  <button class="tab on" id="tabTasks" aria-label="Zadania"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>Zadania</button>
  <button class="fab" id="fab" aria-label="Dodaj zadanie"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tab" id="tabProg" aria-label="Progres"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Progres</button>
</div></nav>
<canvas id="fx"></canvas>

<script>
'use strict';
/* ========= dane ========= */
const KEY = 'passa.v1';
let S = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && Array.isArray(s.tasks)) return s; }catch(e){}
  return {v:1, tasks:[], logs:[], entries:[]};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Nie udało się zapisać. Zrób kopię zapasową w ustawieniach.'); }
}
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-5);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (s, el=document) => el.querySelector(s);

/* ========= daty (tydzień od poniedziałku) ========= */
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey = k => { const [a,b,c] = k.split('-').map(Number); return new Date(a,b-1,c,12); };
function mondayKey(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12); x.setDate(x.getDate() - (x.getDay()+6)%7); return ymd(x); }
function addWeeks(k, n){ const d = parseKey(k); d.setDate(d.getDate() + 7*n); return ymd(d); }
const thisWeek = () => mondayKey(new Date());
function isoWeek(d){ const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t - y0)/864e5 + 1)/7); }
const MON = ['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
const DAYS = ['pn','wt','śr','cz','pt','sb','nd'];
const todayIdx = () => (new Date().getDay()+6)%7;
const fmtDay = ts => { const d = new Date(ts); return d.getDate()+' '+MON[d.getMonth()]; };
const dd = ts => { const d = new Date(ts); return pad(d.getDate())+'.'+pad(d.getMonth()+1); };
const fmt = v => (Math.round(v*100)/100).toString().replace('.', ',');
function parseNum(s){
  s = String(s).trim().replace(',', '.');
  if(!s) return null;
  const m = s.match(/^(\d+):(\d{1,2})$/);
  if(m) return +m[1] + (+m[2])/60;
  const n = Number(s); return isFinite(n) ? n : NaN;
}
function weeksRange(from, to){ const out=[]; let w=from; while(w<=to){ out.push(w); w=addWeeks(w,1); } return out; }

/* ========= logika passy ========= */
const logsOf = (t, w) => S.logs.filter(l => l.taskId===t.id && (!w || l.week===w));
const count = (t, w) => logsOf(t, w).length;
const hasEntry = (t, w) => S.entries.some(e => e.taskId===t.id && e.week===w);
const metMin = (t, w) => count(t,w) >= t.min;
const isGold = (t, w) => count(t,w) >= t.norm && (t.type!=='progress' || hasEntry(t,w));

function streakInfo(t){
  const cur = thisWeek();
  let s = 0, w = addWeeks(cur, -1);
  while(w >= t.startWeek && metMin(t, w)){ s++; w = addWeeks(w, -1); }
  const curMet = metMin(t, cur);
  let best = 0, run = 0, golds = 0;
  for(const wk of weeksRange(t.startWeek, cur)){
    if(metMin(t, wk)){ run++; best = Math.max(best, run); }
    else if(wk !== cur){ run = 0; }
    if(isGold(t, wk)) golds++;
  }
  return {streak: s + (curMet?1:0), curMet, best, golds};
}
function perfectStreak(){
  const active = S.tasks;
  if(!active.length) return 0;
  const cur = thisWeek();
  const ok = w => { const ts = active.filter(t => t.startWeek <= w); return ts.length>0 && ts.every(t => metMin(t,w)); };
  let s = 0, w = addWeeks(cur, -1);
  while(ok(w)){ s++; w = addWeeks(w,-1); }
  return s + (ok(cur)?1:0);
}
function prCount(){
  let n = 0;
  for(const t of S.tasks) for(const te of (t.tests||[])){
    const es = S.entries.filter(e => e.testId===te.id).sort((a,b)=>a.ts-b.ts);
    let best = null;
    for(const e of es){ if(best===null) best = e.value; else if(better(te, e.value, best)){ n++; best = e.value; } }
  }
  return n;
}
const better = (te, a, b) => te.dir==='down' ? a < b : a > b;
function bestOf(te){ const es = S.entries.filter(e=>e.testId===te.id); if(!es.length) return null; return es.reduce((b,e)=> better(te,e.value,b)?e.value:b, es[0].value); }
function lastOf(te){ const es = S.entries.filter(e=>e.testId===te.id).sort((a,b)=>b.ts-a.ts); return es[0] ? es[0].value : null; }

function xpInfo(){
  const cur = thisWeek();
  let xp = S.logs.length*10 + prCount()*25;
  for(const t of S.tasks) for(const w of weeksRange(t.startWeek, cur)){
    if(metMin(t,w)) xp += 30;
    if(isGold(t,w)) xp += 60;
  }
  let lvl = 1; while(xp >= 50*lvl*(lvl+1)) lvl++;
  const lo = 50*(lvl-1)*lvl, hi = 50*lvl*(lvl+1);
  return {xp, lvl, pct: Math.max(0, Math.min(1, (xp-lo)/(hi-lo)))};
}

function taskCard(t){
  const w = thisWeek(), c = count(t,w), st = streakInfo(t), gold = isGold(t,w), met = c >= t.min;
  const left = 7 - todayIdx();
  const risk = !met && (t.min - c) >= left;
  const slots = Math.max(t.norm, c);
  let pips = '';
  for(let i=0;i<slots;i++){
    const cls = ['pip']; if(i<c) cls.push('on'); if(i===t.min-1 && t.min<t.norm) cls.push('minline'); if(i>=t.norm) cls.push('bonus');
    pips += `<span class="${cls.join(' ')}"></span>`;
  }
  let status;
  if(gold) status = `<b>Złoty tydzień</b>${c>t.norm?' · +'+(c-t.norm)+' ponad normę':''}`;
  else if(c >= t.norm && t.type==='progress') status = `<b>Norma zrobiona</b> · wpisz wynik, żeby był złoty`;
  else if(met) status = `<b>Passa bezpieczna</b> · jeszcze ${t.norm-c} do złotego`;
  else status = `<b>Jeszcze ${t.min-c}</b> do minimum · ${left===1?'ostatni dzień':'zostało '+left+' dni'}`;
  const flameCls = gold ? 'gold' : (st.streak>0 ? 'on' : '');
  return `<div class="card ${gold?'gold':met?'met':''} ${risk?'risk':''}" data-id="${t.id}">
    <button class="main" data-detail="${t.id}" aria-label="Szczegóły: ${esc(t.name)}">
      <span class="tname">${esc(t.name)} <span class="tag ${t.type==='progress'?'p':''}">${t.type==='progress'?'01 + progres':'01'}</span></span>
      <span class="pips" aria-label="${c} z ${t.norm}">${pips}</span>
      <span class="status num">${status}</span>
      <span class="status num">min ${t.min}× · norma ${t.norm}× · zrobione ${c}×</span>
    </button>
    <div class="side">
      <span class="streak ${flameCls}" title="Passa tygodni">${FLAME}<span class="num">${st.streak}</span><small>tyg.</small></span>
      <button class="go" data-go="${t.id}" aria-label="Zalicz ${esc(t.name)}">${gold?CHECK:PLUS}</button>
    </div>
  </div>`;
}

function progView(){
  const pts = S.tasks.filter(t => t.type==='progress');

const expanded = new Set();
function testCard(t, te){
  const es = S.entries.filter(e => e.testId===te.id).sort((a,b)=>b.ts-a.ts);
  const unit = esc(te.unit||'');
  if(!es.length) return `<div class="tcard"><div class="thead"><div class="nm">${esc(te.name)}<small>${te.dir==='down'?'mniej = lepiej':'więcej = lepiej'}</small></div><div class="big"><span>brak wyników</span></div></div></div>`;
  const last = es[0].value, first = es[es.length-1].value, best = bestOf(te);
  const diff = last - first, good = te.dir==='down' ? diff < 0 : diff > 0;
  const dcls = diff===0 ? 'flat' : good ? 'up' : 'down';
  const showN = expanded.has(te.id) ? es.length : 4;
  return `<div class="tcard">
    <div class="thead"><div class="nm">${esc(te.name)}<small>${es.length} ${es.length===1?'wynik':es.length<5?'wyniki':'wyników'} · ${te.dir==='down'?'mniej = lepiej':'więcej = lepiej'}</small></div>
      <div class="big num"><b>${fmt(last)}</b><span>${unit}</span><div class="delta ${dcls}">${diff>0?'+':''}${fmt(diff)} ${unit} od startu</div></div></div>
    ${es.length>1 ? `<canvas class="chart" data-chart="${te.id}"></canvas>` : ''}
    <div class="pr">Rekord ${fmt(best)} ${unit}</div>
    <div class="hist">${es.slice(0,showN).map(e => `<div class="hrow num"><span>${fmtDay(e.ts)}</span><b>${fmt(e.value)} ${unit}${e.value===best?' ★':''}</b><button class="x" data-delentry="${e.id}">Usuń</button></div>`).join('')}</div>
    ${es.length>4 ? `<button class="more" data-more="${te.id}">${expanded.has(te.id)?'Pokaż mniej':'Pokaż wszystkie ('+es.length+')'}</button>`:''}
  </div>`;
}

/* ========= wykres ========= */
function drawCharts(){
  const cs = getComputedStyle(document.documentElement);
  const col = n => cs.getPropertyValue(n).trim();
  document.querySelectorAll('canvas[data-chart]').forEach(cv => {
    let te; for(const t of S.tasks) for(const x of (t.tests||[])) if(x.id===cv.dataset.chart) te = x;
    if(!te) return;
    const es = S.entries.filter(e => e.testId===te.id).sort((a,b)=>a.ts-b.ts);
    const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W*dpr; cv.height = H*dpr;
    const g = cv.getContext('2d'); g.scale(dpr,dpr);
    const L = 40, R = 12, T = 12, B = 24;
    let lo = Math.min(...es.map(e=>e.value)), hi = Math.max(...es.map(e=>e.value));
    if(lo===hi){ lo -= 1; hi += 1; }
    const step = niceStep((hi-lo)/3);
    lo = Math.floor(lo/step)*step; hi = Math.ceil(hi/step)*step;
    const t0 = es[0].ts, t1 = es[es.length-1].ts, span = Math.max(1, t1-t0);
    const X = ts => L + (W-L-R) * (ts-t0)/span;
    const Y = v => T + (H-T-B) * (1 - (v-lo)/(hi-lo));
    g.font = '11px system-ui, Roboto, sans-serif'; g.textBaseline = 'middle';
    // siatka
    for(let v=lo; v<=hi+step/2; v+=step){
      const y = Math.round(Y(v))+.5;
      g.strokeStyle = col('--line'); g.lineWidth = 1; g.beginPath(); g.moveTo(L,y); g.lineTo(W-R,y); g.stroke();
      g.fillStyle = col('--muted'); g.textAlign = 'right'; g.fillText(fmt(v), L-8, y);
    }
    // oś x: pierwsza, środkowa, ostatnia data
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    const xs = es.length>2 ? [es[0], es[Math.floor((es.length-1)/2)], es[es.length-1]] : [es[0], es[es.length-1]];
    xs.forEach((e,i) => { g.textAlign = i===0?'left':i===xs.length-1?'right':'center'; g.fillStyle = col('--muted'); g.fillText(dd(e.ts), i===0?L:i===xs.length-1?W-R:X(e.ts), H-6); });
    // wypełnienie
    const grad = g.createLinearGradient(0,T,0,H-B);
    grad.addColorStop(0, hexA(col('--chart'), .28)); grad.addColorStop(1, hexA(col('--chart'), 0));
    g.beginPath(); g.moveTo(X(es[0].ts), H-B);
    es.forEach(e => g.lineTo(X(e.ts), Y(e.value)));
    g.lineTo(X(t1), H-B); g.closePath(); g.fillStyle = grad; g.fill();
    // linia
    g.beginPath(); es.forEach((e,i) => i ? g.lineTo(X(e.ts),Y(e.value)) : g.moveTo(X(e.ts),Y(e.value)));
    g.strokeStyle = col('--chart'); g.lineWidth = 2.5; g.lineJoin = 'round'; g.stroke();
    // punkty
    const best = bestOf(te);
    es.forEach((e,i) => {
      const last = i===es.length-1, isB = e.value===best;
      g.beginPath(); g.arc(X(e.ts), Y(e.value), last?5.5:3.2, 0, Math.PI*2);
      g.fillStyle = isB ? col('--gold') : last ? col('--fg') : col('--chart'); g.fill();
      if(last){ g.lineWidth = 2; g.strokeStyle = col('--surface'); g.stroke(); }
    });
  });
}
function niceStep(x){ if(x<=0) return 1; const p = Math.pow(10, Math.floor(Math.log10(x))), f = x/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
function hexA(hex, a){ const h = hex.replace('#',''); const n = parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }

function bindTestRows(root){

function readTests(root){

/* zaliczanie */
function snapshot(t){ const w = thisWeek(); return {c: count(t,w), met: metMin(t,w), gold: isGold(t,w), lvl: xpInfo().lvl, streak: streakInfo(t).streak}; }

function goTask(t, btn){
  if(t.type==='progress') return resultSheet(t, true, btn);
  const before = snapshot(t);
  const log = addLog(t);
  afterChange(t, before, [], btn, log);
}
function addLog(t){
  const now = new Date();
  const log = {id:uid(), taskId:t.id, ts: now.getTime(), day: ymd(now), week: mondayKey(now)};
  S.logs.push(log); askPersist();
  return log;
}

function resultSheet(t, withLog, btn){
  const tests = t.tests || [];
  openSheet(`
    <h4>${esc(t.name)}</h4>
    <p class="sub">${withLog?'Wpisz wyniki z tego treningu. Puste pola zostaną pominięte.':'Dodaj wyniki bez zaliczania treningu.'}</p>
    <div id="logRows">${tests.map(te => logRowHTML(te)).join('')}</div>
    ${tests.length?'':'<p class="hint">To zadanie nie ma jeszcze testów. Dodaj pierwszy poniżej.</p>'}
    <div class="newtest" id="newTest" ${tests.length?'hidden':''}>
      <div class="lab" style="margin-bottom:8px">Nowy test</div>
      ${testRowHTML(null,false)}
      <button type="button" class="small-btn" id="ntAdd">Dodaj test</button>
    </div>
    <button type="button" class="addt" id="ntOpen" ${tests.length?'':'hidden'}>+ Nowy test</button>
    <div class="btns">
      <button class="btn pri" id="rSave">${withLog?'Zapisz i zalicz':'Zapisz wyniki'}</button>
      ${withLog?'<button class="btn" id="rSkip">Zalicz bez wyniku</button>':''}
      <button class="btn ghost" id="rCancel">Anuluj</button>
    </div>`, sh => {
    bindTestRows($('#newTest',sh));

    $('#ntAdd',sh).onclick = () => {
      const [nt] = readTests($('#newTest',sh));

      $('#logRows',sh).insertAdjacentHTML('beforeend', logRowHTML(nt));

      $('#logRows .logt:last-child input',sh).focus();

      const vals = []; let bad = null;
      sh.querySelectorAll('.logt').forEach(r => {
        const v = parseNum($('input',r).value);

        if(isNaN(v)){ bad = r; return; }

      });
      if(bad){ const i = $('input',bad); i.classList.add('shake'); i.focus(); setTimeout(()=>i.classList.remove('shake'),400); return; }
      if(!withLog && !vals.length){ closeSheet(); return; }
      const before = snapshot(t);
      const prs = [];
      const now = new Date();
      const log = withLog ? addLog(t) : null;
      vals.forEach(v => {
        const te = t.tests.find(x => x.id===v.testId);
        const prev = bestOf(te);
        if(prev!==null && better(te, v.value, prev)) prs.push(`${te.name} ${fmt(v.value)} ${te.unit||''}`.trim());
        S.entries.push({id:uid(), taskId:t.id, testId:v.testId, value:v.value, ts: now.getTime(), day: ymd(now), week: mondayKey(now), logId: log?log.id:null});
      });
      askPersist();
      closeSheet(); afterChange(t, before, prs, btn, log, !withLog);
    };
    const first = $('#logRows input',sh); if(first) setTimeout(()=>first.focus(), 250);
  });
}
function logRowHTML(te){
  const last = lastOf(te), best = bestOf(te), u = esc(te.unit||'');
  return `<div class="logt" data-tid="${te.id}">
    <div class="nm"><b>${esc(te.name)}${u?' · '+u:''}</b><small class="num">${last===null?'pierwszy wynik':'ostatnio '+fmt(last)+' · rekord '+fmt(best)}</small></div>
    <input class="inp num" inputmode="decimal" placeholder="${last===null?'0':fmt(last)}" aria-label="${esc(te.name)}">
  </div>`;
}

function afterChange(t, before, prs, btn, log, entriesOnly){
  save();
  const after = snapshot(t);
  render();
  const newBtn = document.querySelector(`[data-go="${t.id}"]`);
  if(newBtn){ newBtn.classList.add('pop'); }
  const origin = newBtn ? newBtn.getBoundingClientRect() : null;
  const ox = origin ? origin.left+origin.width/2 : innerWidth/2, oy = origin ? origin.top+origin.height/2 : innerHeight/2;

  if(!before.gold && after.gold){ confetti('gold'); buzz([40,60,40,60,120]); burst('Złoty tydzień', `${t.name} · passa ${after.streak} tyg.`, true); }
  else if(!before.met && after.met){ confetti('big'); buzz([30,50,90]); burst(after.streak>1?'Passa '+after.streak+' tyg.':'Minimum!', after.streak>1?`${t.name} · utrzymana`:`${t.name} · passa ruszyła`); }
  else if(prs.length){ confetti('gold'); buzz([30,40,30,40,80]); burst('Nowy rekord', prs.join(', '), true); }
  else if(!entriesOnly){ confetti('small', ox, oy); buzz(25); }
  if(prs.length && (before.gold!==after.gold || before.met!==after.met)) setTimeout(()=>toast('Nowy rekord: '+prs.join(', ')), 2000);
  if(after.lvl > before.lvl) setTimeout(()=>{ burst('Poziom '+after.lvl, 'Tak trzymaj', true); confetti('big'); buzz([50,50,50]); }, 2100);

  if(log) toast(`Zaliczone: ${t.name} (${after.c}×)`, 'Cofnij', () => {
    S.logs = S.logs.filter(l => l.id!==log.id);
    S.entries = S.entries.filter(e => e.logId!==log.id);
    save(); render(); toast('Cofnięto');
  });
  else if(entriesOnly) toast('Zapisano wyniki');
}

/* szczegóły zadania */
function detailSheet(t){
  const st = streakInfo(t), cur = thisWeek();
  const weeks = []; for(let i=11;i>=0;i--) weeks.push(addWeeks(cur,-i));
  const cells = weeks.map(w => {
    if(w < t.startWeek) return '<i class="none"></i>';
    const c = isGold(t,w) ? 'gold' : metMin(t,w) ? 'met' : (w===cur ? '' : 'miss');
    return `<i class="${c} ${w===cur?'cur':''}" title="${fmtDay(parseKey(w))}: ${count(t,w)}×"></i>`;
  }).join('');
  const logs = logsOf(t, cur).sort((a,b)=>b.ts-a.ts);
  openSheet(`
    <h4>${esc(t.name)}</h4>
    <p class="sub">${t.type==='progress'?'01 + progres':'01'} · minimum ${t.min}× · norma ${t.norm}× w tygodniu</p>
    <div class="dstats">
      <div><small>Passa</small><b class="num" style="color:${st.streak?'var(--flame)':'inherit'}">${st.streak}</b></div>
      <div><small>Najdłuższa</small><b class="num">${st.best}</b></div>
      <div><small>Złote tyg.</small><b class="num" style="color:${st.golds?'var(--gold)':'inherit'}">${st.golds}</b></div>
    </div>
    <div class="lab">Ostatnie 12 tygodni</div>
    <div class="grid12">${cells}</div>
    <div class="legend"><span><i style="background:var(--gold)"></i>złoty</span><span><i style="background:var(--flame)"></i>minimum</span><span><i style="background:#3A2530"></i>pudło</span></div>
    <div class="lab" style="margin-bottom:4px">W tym tygodniu</div>
    <div class="hist" style="border-top:0">${logs.length ? logs.map(l => `<div class="hrow num"><span>${DAYS[(new Date(l.ts).getDay()+6)%7]} ${fmtDay(l.ts)}, ${pad(new Date(l.ts).getHours())}:${pad(new Date(l.ts).getMinutes())}</span><button class="x" data-dellog="${l.id}">Cofnij</button></div>`).join('') : '<div class="hrow"><span>Jeszcze nic. Zalicz pierwszy raz.</span></div>'}</div>
    <div class="btns">
      <button class="btn" id="dEdit">Edytuj zadanie</button>
      <button class="btn ghost" id="dClose">Zamknij</button>
    </div>`, sh => {
    $('#dEdit',sh).onclick = () => taskForm(t);
    $('#dClose',sh).onclick = closeSheet;
    sh.querySelectorAll('[data-dellog]').forEach(b => b.onclick = () => {
      if(!b.classList.contains('sure')){ b.classList.add('sure'); b.textContent = 'Na pewno?'; return; }
      S.logs = S.logs.filter(l => l.id!==b.dataset.dellog);
      S.entries = S.entries.filter(e => e.logId!==b.dataset.dellog);
      save(); render(); detailSheet(t);
    });
  });
}

/* ustawienia */
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
function settingsSheet(){
  const standalone = matchMedia('(display-mode: standalone)').matches;
  openSheet(`
    <h4>Ustawienia</h4>
    <p class="sub">Dane są zapisane tylko w tym telefonie. Rób czasem kopię zapasową.</p>
    <div class="btns" style="margin-top:0">
      ${installEvt && !standalone ? '<button class="btn pri" id="sInstall">Zainstaluj jako apkę</button>' : ''}
      <button class="btn" id="sExport">Zapisz kopię zapasową</button>
      <button class="btn" id="sImport">Wczytaj kopię z pliku</button>
      <input type="file" id="sFile" accept="application/json,.json" hidden>
      <button class="btn ghost" id="sClose">Zamknij</button>
    </div>
    <p class="hint num" style="margin-top:14px">${S.tasks.length} zadań · ${S.logs.length} zaliczeń · ${S.entries.length} wyników · ${xpInfo().xp} XP</p>`, sh => {
    $('#sClose',sh).onclick = closeSheet;
    const ins = $('#sInstall',sh); if(ins) ins.onclick = async () => { installEvt.prompt(); await installEvt.userChoice; installEvt = null; closeSheet(); };
    $('#sExport',sh).onclick = () => {
      const blob = new Blob([JSON.stringify(S,null,1)], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'passa-kopia-'+ymd(new Date())+'.json';
      document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast('Kopia zapisana w Pobranych');
    };
    $('#sImport',sh).onclick = () => $('#sFile',sh).click();
    $('#sFile',sh).onchange = async e => {
      const f = e.target.files[0]; if(!f) return;
      try{
        const d = JSON.parse(await f.text());
        if(!d || !Array.isArray(d.tasks) || !Array.isArray(d.logs) || !Array.isArray(d.entries)) throw 0;
        S = d; save(); closeSheet(); render(); toast('Wczytano kopię');
      }catch(err){ toast('To nie jest plik kopii z Passy'); }
    };
  });
}

/* ========= efekty ========= */
let toastTimer;
function toast(msg, action, fn){
  const old = $('.toast'); if(old) old.remove(); clearTimeout(toastTimer);
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<span>${esc(msg)}</span>${action?`<button>${esc(action)}</button>`:''}`;
  if(action) $('button',el).onclick = () => { el.remove(); fn(); };
  document.body.appendChild(el);
  toastTimer = setTimeout(() => el.remove(), action ? 5000 : 2600);
}
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(title, sub, gold){
  if(reduce){ toast(title+' · '+sub); return; }
  const old = $('.burst'); if(old) old.remove();
  const el = document.createElement('div'); el.className = 'burst'+(gold?' gold':'');
  el.innerHTML = `<div><b>${esc(title)}</b><span>${esc(sub)}</span></div>`;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2000);
}
const fx = $('#fx'), fg = fx.getContext('2d');
let parts = [], raf = 0;
function confetti(kind, x, y){
  if(reduce) return;
  const dpr = devicePixelRatio || 1; fx.width = innerWidth*dpr; fx.height = innerHeight*dpr; fg.setTransform(dpr,0,0,dpr,0,0);
  const gold = ['#F5C542','#FFE08A','#FFB23E','#FFF4CC'], fire = ['#FF7A1A','#FFB23E','#F5C542','#86A2FF','#3DDC97','#F3F1EA'];
  const cols = kind==='gold' ? gold : fire;
  const n = kind==='small' ? 26 : kind==='gold' ? 170 : 120;
  for(let i=0;i<n;i++){
    let px, py, vx, vy;
    if(kind==='small'){ px = x; py = y; const a = Math.random()*Math.PI*2, s = 2+Math.random()*5; vx = Math.cos(a)*s; vy = Math.sin(a)*s - 3; }
    else { const side = i%2; px = side ? innerWidth+10 : -10; py = innerHeight*0.75; vx = (side?-1:1)*(4+Math.random()*8); vy = -(9+Math.random()*9); }
    parts.push({x:px, y:py, vx, vy, r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3, w:5+Math.random()*6, h:8+Math.random()*8, c:cols[i%cols.length], life:0});
  }
  if(!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  fg.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p => p.y < innerHeight+40 && p.life < 260);
  for(const p of parts){
    p.life++; p.vy += .28; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    fg.save(); fg.translate(p.x,p.y); fg.rotate(p.r); fg.fillStyle = p.c; fg.globalAlpha = Math.min(1, (260-p.life)/40);
    fg.fillRect(-p.w/2, -p.h/2*Math.abs(Math.cos(p.life*.12)), p.w, p.h*Math.abs(Math.cos(p.life*.12))+1); fg.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : 0;
  if(!raf) fg.clearRect(0,0,innerWidth,innerHeight);
}
let persisted = false;
function askPersist(){ if(persisted) return; persisted = true; try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){} }

/* ========= zdarzenia ========= */
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if(go){ const t = S.tasks.find(x => x.id===go.dataset.go); if(t) goTask(t, go); return; }
  const det = e.target.closest('[data-detail]');
  if(det){ const t = S.tasks.find(x => x.id===det.dataset.detail); if(t) detailSheet(t); return; }
  const ar = e.target.closest('[data-addres]');
  if(ar){ const t = S.tasks.find(x => x.id===ar.dataset.addres); if(t) resultSheet(t, false); return; }
  const de = e.target.closest('[data-delentry]');
  if(de){
    if(!de.classList.contains('sure')){ de.classList.add('sure'); de.textContent = 'Na pewno?'; setTimeout(()=>{ if(de.isConnected){ de.classList.remove('sure'); de.textContent='Usuń'; } }, 3000); return; }
    S.entries = S.entries.filter(x => x.id!==de.dataset.delentry); save(); render(); toast('Usunięto wynik'); return;
  }
  const mo = e.target.closest('[data-more]');
  if(mo){ const id = mo.dataset.more; expanded.has(id) ? expanded.delete(id) : expanded.add(id); render(); return; }
  if(e.target.closest('#openSettings')) return settingsSheet();
  if(e.target.closest('#emptyAdd')) return taskForm(null);
  if(e.target.closest('#emptyAddP')) return taskForm(null, 'progress');
});
$('#fab').onclick = () => taskForm(null, tab==='prog' ? 'progress' : 'check');
$('#tabTasks').onclick = () => { tab = 'tasks'; render(); scrollTo(0,0); };
$('#tabProg').onclick = () => { tab = 'prog'; render(); scrollTo(0,0); };
addEventListener('resize', () => { if(tab==='prog') drawCharts(); });
document.addEventListener('visibilitychange', () => { if(!document.hidden && !$('#scrim')) render(); });
addEventListener('keydown', e => { if(e.key==='Escape') closeSheet(); });

render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
